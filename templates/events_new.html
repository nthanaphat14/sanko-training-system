{% extends "base.html" %}
{% block content %}

<div class="page-head">
  <div>
    <h1>New Training Event</h1>
    <div class="muted">สร้างรอบอบรมใหม่</div>
  </div>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <a class="btn ghost" href="{{ url_for('events_list') }}">Back</a>
    <a class="btn" href="{{ url_for('course_new') }}">+ New Course</a>
  </div>
</div>

<div class="card">
  <form method="post" style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">

    <div class="field" style="grid-column:1/-1;">
      <label>Course</label>

      <div style="display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
        <select class="input" id="courseTypeFilter" style="max-width:180px;">
          <option value="">All Type</option>
          <option value="INH">INH</option>
          <option value="EXT">EXT</option>
          <option value="OJT">OJT</option>
        </select>

        <input class="input" id="courseSearch" type="text"
               placeholder="ค้นหา code / course name..."
               style="flex:1; min-width:260px;">
      </div>

      <select class="input" name="course_id" id="courseSelect" required>
        <option value="">-- เลือกหลักสูตร --</option>
        {% for c in courses %}
          <option value="{{ c.id }}"
                  data-trainer="{{ c.vendor or '' }}"
                  data-location="{{ c.location or '' }}"
                  data-title="{{ c.course_name or '' }}"
                  data-type="{{ c.course_type or '' }}"
                  data-code="{{ (c.course_code or '')|lower }}"
                  data-name="{{ (c.course_name or '')|lower }}">
            {{ c.course_code }} • {{ c.course_name }} • {{ c.course_type }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Title</label>
      <input class="input" id="title" name="title" placeholder="ถ้าไม่กรอก จะใช้ชื่อหลักสูตร">
    </div>

    <div class="field">
      <label>Start Date</label>
      <input class="input" type="date" name="start_date" required>
    </div>

    <div class="field">
      <label>End Date</label>
      <input class="input" type="date" name="end_date">
    </div>

    <div class="field">
      <label>Location</label>
      <input class="input" id="location" name="location">
    </div>

    <div class="field">
      <label>Trainer</label>
      <input class="input" id="trainer" name="trainer">
    </div>

    <div style="grid-column:1/-1; display:flex; gap:10px;">
      <button class="btn primary" type="submit">Save Event</button>
      <a class="btn ghost" href="{{ url_for('events_list') }}">Cancel</a>
    </div>

  </form>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const courseSelect = document.getElementById("courseSelect");
  const trainerInput = document.getElementById("trainer");
  const locationInput = document.getElementById("location");
  const titleInput = document.getElementById("title");
  const courseSearch = document.getElementById("courseSearch");
  const courseTypeFilter = document.getElementById("courseTypeFilter");

  if (!courseSelect) return;

  function fillFromSelected() {
    const selected = courseSelect.options[courseSelect.selectedIndex];
    if (!selected || !selected.value) return;

    const trainer = selected.getAttribute("data-trainer") || "";
    const location = selected.getAttribute("data-location") || "";
    const title = selected.getAttribute("data-title") || "";

    if (trainerInput && !trainerInput.value.trim()) {
      trainerInput.value = trainer;
    }
    if (locationInput && !locationInput.value.trim()) {
      locationInput.value = location;
    }
    if (titleInput && !titleInput.value.trim()) {
      titleInput.value = title;
    }
  }

  function filterCourses() {
    const keyword = (courseSearch?.value || "").trim().toLowerCase();
    const type = (courseTypeFilter?.value || "").trim().toUpperCase();

    Array.from(courseSelect.options).forEach((opt, idx) => {
      if (idx === 0) {
        opt.hidden = false;
        return;
      }

      const code = (opt.getAttribute("data-code") || "").toLowerCase();
      const name = (opt.getAttribute("data-name") || "").toLowerCase();
      const optType = (opt.getAttribute("data-type") || "").toUpperCase();

      const matchKeyword = !keyword || code.includes(keyword) || name.includes(keyword);
      const matchType = !type || optType === type;

      opt.hidden = !(matchKeyword && matchType);
    });

    const selected = courseSelect.options[courseSelect.selectedIndex];
    if (selected && selected.hidden) {
      courseSelect.selectedIndex = 0;
    }
  }

  courseSelect.addEventListener("change", fillFromSelected);
  if (courseSearch) courseSearch.addEventListener("input", filterCourses);
  if (courseTypeFilter) courseTypeFilter.addEventListener("change", filterCourses);

  fillFromSelected();
});
</script>


{% endblock %}
